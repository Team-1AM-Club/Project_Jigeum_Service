[tool.black]
line-length = 88
target-version = ["py311"]
include = '\\.pyi?$'
exclude = '\\/(\\.git|\\.venv|__pycache__|\\.pytest_cache|build|dist|\\.mypy_cache|\\.ruff_cache)/'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["**/__pycache__/*", "**/.pytest_cache/*"]

[tool.ruff]
line-length = 88
target-version = "py311"
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
